name: Publica o dashboard no GitHub Pages

# O dashboard e um HTML unico gerado por `agentes dashboard` a partir dos
# artefatos das rodadas. Ele nao fala com LLM nem com a API, entao pode ser
# publicado como site estatico sem nenhuma chave.
on:
  push:
    branches: [main]
    paths:
      - artifacts/dashboard.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Monta o site
        run: |
          mkdir -p _site
          cp artifacts/dashboard.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
