[project]
name = "agentes-industriais"
version = "0.1.0"
description = "Plataforma de suporte técnico industrial com agentes de IA e arnês de avaliação"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2", "fastmcp>=2.0"]
agent = ["google-genai", "openai>=1.50", "langgraph>=0.2"]
eval = [
    "pandas>=2.2",
    "pyarrow>=17",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "scikit-learn>=1.5",
]
backend = ["fastapi>=0.115", "uvicorn>=0.30", "sse-starlette>=2.1", "redis>=5.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "polyfactory>=2.17",
    "python-dotenv>=1.0",
    "respx>=0.21",
    "time-machine>=2.15",
    "import-linter>=2.0",
    "ruff",
    "mypy",
]

[project.scripts]
agentes = "src.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Regra de dependência — doc 13 §2. Um import fora da regra quebra o build.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["src"]
# Exigido porque os contratos proíbem pacotes externos (SDKs de LLM) — é o que faz
# valer a promessa de que `analysis/` roda sem chave de API.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas"
type = "layers"
layers = [
    "src.interfaces",
    "src.agents | src.tools | src.evaluation | src.analysis | src.intake",
    "src.core",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "Analise nao conhece execucao"
type = "forbidden"
source_modules = ["src.analysis"]
# `google` e não `google.genai`: o import-linter só aceita pacotes externos no nível
# de topo. É o contrato que sustenta "o trace é o contrato" — quem reproduz os
# resultados a partir dos traces não precisa de SDK de LLM nem de chave de API.
forbidden_modules = [
    "src.agents",
    "src.tools",
    "src.evaluation",
    "google",
    "openai",
    "langgraph",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Modulos independentes"
type = "independence"
modules = [
    "src.agents",
    "src.tools",
    "src.evaluation",
    "src.analysis",
    "src.intake",
]

[[tool.importlinter.contracts]]
name = "Nucleo de ferramentas sem dominio"
type = "forbidden"
source_modules = ["src.tools.core"]
forbidden_modules = ["src.tools.overlay", "src.tools.provider"]

[[tool.importlinter.contracts]]
name = "Nucleo sem dependencias internas"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = [
    "src.agents",
    "src.tools",
    "src.evaluation",
    "src.analysis",
    "src.intake",
    "src.storage",
    "src.llm",
    "src.interfaces",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
